<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Migration in Australia</title>

    <!-- Pure.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Custom styles -->
    <link rel="stylesheet" href="layout.css">

    <!-- Vega-Lite -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
    <div class="pure-g">

        <!-- Header -->
        <div class="pure-u-1">
            <h1>Bird Migration in Australia</h1>
            <p id="subtitle">Exploring the seasonal patterns, population trends, and geographic spread of migratory shorebirds across Australia.</p>
        </div>

        <!-- Chart 1 and Chart 3 side by side -->
        <div class="pure-u-1-2">
            <div id="chart1" class="chart_container"></div>
        </div>
        <div class="pure-u-1-2">
            <div id="chart3" class="chart_container"></div>
        </div>

        <!-- Chart 2 full width -->
        <div class="pure-u-1">
            <div id="chart2" class="chart_container"></div>
        </div>

    </div>

    <script src="vega_lite_vis.js"></script>

</html>
